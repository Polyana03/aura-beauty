<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Beauty</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="top-dots">
          <span class="dot dot1"></span>
          <span class="dot dot2"></span>
          <span class="dot dot3"></span>
        </div>

        <h1 class="brand">Aura Beauty</h1>

        <nav class="menu">
          <button class="menu-item active" data-view="inicio">Início</button>
          <button class="menu-item" data-view="agendar">Agendar</button>
          <button class="menu-item" data-view="agenda">Agenda/Histórico</button>
        </nav>

        <button class="logout">Sair <span>↗</span></button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Buscar início, agendar..." />
            <button class="search-close">×</button>
          </div>

          <div class="profile">
            <div class="profile-avatar">M</div>
            <div class="profile-info">
              <strong>Olá, Maria!</strong>
              <span>Cliente</span>
            </div>
            <span class="dropdown">▼</span>
          </div>
        </header>

        <section id="pageContent" class="content"></section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
