<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Aura Beauty</title>
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>Aura Beauty</h1>
            <p>Sistema de Agendamento</p>
        </div>

        <div class="login_cadastro">

            <div class="titulo_login">
                <h2>Faça seu login</h2>
            </div>

            <form id="form_login">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail...">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha...">
                </div>

                <button type="submit" id="entrar">
                    Entrar
                </button>

            </form>

            <div class="divisor">
                <hr>
                <span>ou</span>
                <hr>
            </div>

            <form id="form_criar">

                <button type="submit" id="criar">
                    Criar conta
                </button>

            </form>

            <a href="#" class="esqueceu_senha">
                Esqueceu sua senha?
            </a>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
