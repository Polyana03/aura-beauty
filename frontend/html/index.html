<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Beauty</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- logo e slogan -->
        <div class="logo">
            <h1>Aura Beauty</h1>
            <p>Seu momento de beleza começa aqui</p>
        </div>

        <!-- Área de Login e Cadastro -->
        <div class="login_cadastro">
           
            <div class="titulo_login">
                <h2>Faça seu login</h2>
            </div>
            <!-- Formulário de Login -->
            <form id="formLogin">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail...">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha...">
                </div>

                <button type="submit" id="entrar">
                    Entrar
                </button>
            </form>

            <!-- Divisor -->
            <div class="divisor">
                <hr>
                <span>ou</span>
                <hr>
            </div>

            <!-- Botão Criar Conta -->
            <form id="formCriar">
                <button type="submit" id="criar">
                    Criar conta
                </button>
            </form>
            <!-- link para recuperar Senha -->
            <a href="#" class="esqueceu_senha">
                Esqueceu sua senha?
            </a>

        </div>

    </div>

    <script src="../js/login.js"></script>
</body>
</html>
