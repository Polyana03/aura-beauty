<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Beauty | Agenda</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-body">
    <div class="container">
      <aside class="sidebar">
        <h1 class="logo">Aura Beauty</h1>
        <nav class="menu">
          <a href="inicio.html" class="menu-item">Início</a>
          <a href="agendar.html" class="menu-item">Agendar</a>
          <a href="agenda.html" class="menu-item ativo">Agenda/Histórico</a>
        </nav>
        <button id="sairBtn" class="sair" type="button">Sair ←</button>
      </aside>

      <main class="conteudo">
        <header class="topo">
          <div class="barra-pesquisa">
            <img class="icone-lupa" src="../imagem/lupa.jpg" alt="" />
            <input id="campoBusca" type="text" placeholder="Buscar agendamento, cliente ou serviço..." />
            <button class="btn-fechar" type="button">✕</button>
          </div>

          <div class="perfil-wrapper">
            <div class="perfil-topo">
              <img id="usuarioAvatar" src="../imagem/mulher.jpg" alt="Perfil" class="foto-perfil" />
              <div class="info-usuario">
                <span id="usuarioNome" class="nome-usuario">Olá, Maria!</span>
                <span class="tipo-usuario">Cliente</span>
              </div>
              <button class="seta-btn" type="button" aria-expanded="false" aria-label="Abrir informações do usuário">▼</button>
            </div>

            <div id="perfilMenu" class="perfil-menu" aria-hidden="true">
              <div class="perfil-menu-item">
                <span>Nome</span>
                <strong id="perfilNome">Maria</strong>
              </div>
              <div class="perfil-menu-item">
                <span>Email</span>
                <strong id="perfilEmail">maria@email.com</strong>
              </div>
              <div class="perfil-menu-item">
                <span>Tipo</span>
                <strong id="perfilTipo">Cliente</strong>
              </div>
            </div>
          </div>
        </header>

        <section class="boas-vindas">
          <h2>Agenda</h2>
          <p class="subtitulo">Próximos agendamentos do seu salão.</p>
        </section>

        <section class="cards-estatisticos">
          <div class="card-estat">
            <strong id="estatAgendamentosHoje">0</strong>
            <span>Agendamentos para hoje</span>
          </div>
          <div class="card-estat">
            <strong id="estatMesAtual">0</strong>
            <span id="labelMesAtual">Mês atual</span>
          </div>
          <div class="card-estat">
            <strong id="estatFaturamentoMes">R$0,00</strong>
            <span>Faturamento do mês</span>
          </div>
          <div class="card-estat">
            <strong id="estatFaturamentoDia">R$0,00</strong>
            <span>Faturamento do dia</span>
          </div>
        </section>

        <section class="page-card">
          <div class="agenda-header">
            <h3>Próximos agendamentos</h3>
          </div>

          <div id="listaAgendamentos" class="agenda-list"></div>
        </section>
      </main>
    </div>

    <script src="js/agenda.js"></script>
  </body>
</html>
