<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Beauty - Painel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-body">
    <div class="container">
      <aside class="sidebar">
        <h1 class="logo">Aura Beauty</h1>
        <nav class="menu">
          <a href="inicio.html" class="menu-item ativo">Início</a>
          <a href="agendar.html" class="menu-item">Agendar</a>
          <a href="agenda.html" class="menu-item">Agenda/Histórico</a>
        </nav>
        <button id="sairBtn" class="sair" type="button">Sair ←</button>
      </aside>

      <main class="conteudo">
        <header class="topo">
          <div class="barra-pesquisa">
            <span class="icone-lupa">🔍</span>
            <input type="text" placeholder="Buscar início, agendar..." />
            <button class="btn-fechar" type="button">✕</button>
          </div>

          <div class="perfil-wrapper">
            <div class="perfil-topo">
              <img id="usuarioAvatar" src="../imagem/mulher.jpg" alt="Perfil" class="foto-perfil" />
              <div class="info-usuario">
                <span id="usuarioNome" class="nome-usuario">Olá, Maria!</span>
                <span class="tipo-usuario">Cliente</span>
              </div>
              <button class="seta-btn" type="button" aria-expanded="false" aria-label="Abrir informações do usuário">▼</button>
            </div>

            <div id="perfilMenu" class="perfil-menu" aria-hidden="true">
              <div class="perfil-menu-item">
                <span>Nome</span>
                <strong id="perfilNome">Maria</strong>
              </div>
              <div class="perfil-menu-item">
                <span>Email</span>
                <strong id="perfilEmail">maria@email.com</strong>
              </div>
              <div class="perfil-menu-item">
                <span>Tipo</span>
                <strong id="perfilTipo">Cliente</strong>
              </div>
            </div>
          </div>
        </header>

        <section class="boas-vindas">
          <h2 id="mensagemBoasVindas">Olá, Maria!</h2>
          <p class="subtitulo">Bem-vinda ao painel do seu salão.</p>
          <div class="horario-proximo">
            <strong>Seu próximo horário:</strong>
            <span id="proximoHorario" class="servico-horario">Carregando...</span>
          </div>
        </section>

        <section class="cards-estatisticos">
          <div class="card-estat">
            <strong>9</strong>
            <span>Agendamentos para hoje</span>
          </div>
          <div class="card-estat">
            <strong>24</strong>
            <span>Maio 2026</span>
          </div>
          <div class="card-estat">
            <strong>3</strong>
            <span>Horários disponíveis</span>
          </div>
          <div class="card-estat">
            <strong>R$350,00</strong>
            <span>Faturamento do dia</span>
          </div>
        </section>

        <div class="linha-conteudo">
          <div class="ilustracao">
            <div class="ilustracao-card"></div>
          </div>

          <div id="listaProfissionais" class="coluna-cards"></div>
        </div>
      </main>
    </div>

    <script src="js/inicio.js"></script>
  </body>
</html>
